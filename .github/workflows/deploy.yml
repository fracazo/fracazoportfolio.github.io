name: Deploy to GitHub Pages

# Builds the Next.js static export and deploys it to GitHub Pages.
# NOTE: This only runs once the repo's Pages "Source" is set to
# "GitHub Actions" (done at cutover). Safe to commit before then.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      # Keep earlier builds' code chunks on the site. A deploy replaces every
      # file, so a page opened before it (or cached by the browser) would ask
      # for chunks that no longer exist when it opens a case study in the
      # sheet, and the page would crash. Chunk names are content hashes, so
      # old and new sit side by side without clashing. The archive lives in
      # the Actions cache; chunks older than 30 days are dropped.
      - name: Restore earlier chunks
        uses: actions/cache/restore@v4
        with:
          path: .chunk-archive
          key: chunk-archive-${{ github.run_id }}
          restore-keys: chunk-archive-

      - name: Merge earlier chunks into the build
        run: |
          mkdir -p .chunk-archive/_next/static
          find .chunk-archive -type f -mtime +30 -delete
          cp -r --update=none .chunk-archive/_next/static/. out/_next/static/
          cp -r --update=none out/_next/static/. .chunk-archive/_next/static/

      - name: Save chunk archive
        uses: actions/cache/save@v4
        with:
          path: .chunk-archive
          key: chunk-archive-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
