  /* Warm charcoal (espresso) tokens, mirroring the site's dark theme in globals.css */
  :root {
    --bg: #1a1612;
    --text: #ece7df;
    --muted: #a2988c;
    --brand: #c8855a;
    --border: #2e2922;
  }

  html, body { margin: 0; padding: 0; background: var(--bg); }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: "Geist", system-ui, sans-serif;
  }

  .card > svg.bg {
    position: absolute;
    inset: 0;
    display: block;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-bottom: 8px;
  }

  /* Matches the site's page titles: Young Serif, weight 400 */
  h1 {
    margin: 0;
    font-family: "Young Serif", Georgia, serif;
    font-size: 88px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.015em;
    color: var(--text);
  }
  h1 .accent { color: var(--brand); }
  h1 .wave {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    font-size: 0.86em;
    letter-spacing: 0;
    margin-right: 0.18em;
    vertical-align: -0.06em;
  }
</style>
</head>
<body>
<div class="card">
  <svg class="bg" width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Repeating tool pattern: axe + pickaxe (Lucide, ISC license), tight checkerboard weave -->
      <pattern id="tools" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <g fill="none" stroke="#3a3128" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(14 16) scale(1.4)">
            <g transform="rotate(-8 12 12)">
              <path d="m14 12-8.381 8.38a1 1 0 0 1-3.001-3L11 9"/>
              <path d="M15 15.5a.5.5 0 0 0 .5.5A6.5 6.5 0 0 0 22 9.5a.5.5 0 0 0-.5-.5h-1.672a2 2 0 0 1-1.414-.586l-5.062-5.062a1.205 1.205 0 0 0-1.704 0L9.352 5.648a1.205 1.205 0 0 0 0 1.704l5.062 5.062A2 2 0 0 1 15 13.828z"/>
            </g>
          </g>
          <g transform="translate(74 76) scale(1.4)">
            <g transform="rotate(10 12 12)">
              <path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3L11 9.999"/>
              <path d="M15.973 4.027A13 13 0 0 0 5.902 2.373c-1.398.342-1.092 2.158.277 2.601a19.9 19.9 0 0 1 5.822 3.024"/>
              <path d="M16.001 11.999a19.9 19.9 0 0 1 3.024 5.824c.444 1.369 2.26 1.676 2.603.278A13 13 0 0 0 20 8.069"/>
              <path d="M18.352 3.352a1.205 1.205 0 0 0-1.704 0l-5.296 5.296a1.205 1.205 0 0 0 0 1.704l2.296 2.296a1.205 1.205 0 0 0 1.704 0l5.296-5.296a1.205 1.205 0 0 0 0-1.704z"/>
            </g>
          </g>
        </g>
      </pattern>

      <!-- Fade the pattern out behind the text -->
      <radialGradient id="fade">
        <stop offset="0%" stop-color="#1a1612" stop-opacity="0.94"/>
        <stop offset="45%" stop-color="#1a1612" stop-opacity="0.78"/>
        <stop offset="75%" stop-color="#1a1612" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
      </radialGradient>

      <!-- Faint clay-accent glow from the top -->
      <radialGradient id="glow" cx="50%" cy="-20%" r="75%">
        <stop offset="0%" stop-color="#c8855a" stop-opacity="0.14"/>
        <stop offset="100%" stop-color="#c8855a" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="1200" height="630" fill="#1a1612"/>
    <rect width="1200" height="630" fill="url(#tools)"/>
    <rect width="1200" height="630" fill="url(#fade)"/>
    <rect width="1200" height="630" fill="url(#glow)"/>

    <!-- Hairline card frame -->
    <rect x="24" y="24" width="1152" height="582" rx="18" fill="none" stroke="#3a332b" stroke-width="1.5"/>
  </svg>

  <div class="content">
    <h1><span class="wave">&#128075;</span>Olá, I&rsquo;m <span class="accent">Alex!</span></h1>
  </div>
</div>
</body>
</html>
